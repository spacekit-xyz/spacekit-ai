name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace

  supporting-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p growformer-ledger --all-targets -- -D warnings
      - run: cargo test -p growformer-ledger
      - run: cargo clippy -p growformer-nca --all-targets
      - run: cargo test -p growformer-nca

  growformer-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p growformer-llm --no-default-features --features vanilla-lm,clifford-lm
      - run: cargo test -p growformer-llm

  growformer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check lean runtime
        run: cargo check -p growformer --no-default-features --bin growformer-runtime
      - name: Run library tests
        run: cargo test -p growformer --lib
      - name: Run integration tests
        run: cargo test -p growformer --test brain_merge --test causal_ordering_probe --test wasm_service_test
