[package]
name = "growformer"
version = "0.1.0"
edition = "2021"
build = "build.rs"
default-run = "growformer"

[lib]
name = "growformer"
path = "src/lib.rs"

[[bin]]
name = "growformer"
path = "src/main.rs"

[[bin]]
name = "growformer-node"
path = "src/server.rs"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
indicatif = "0.17"
kiddo = "5.2.4"
mnist = "0.6"
rand = "0.8"
rayon = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
