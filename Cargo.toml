[workspace]
resolver = "2"
members = [
    "growformer",
    "growformer-ledger",
    "growformer-llm",
    "growformer-nca",
]

[workspace.package]
edition = "2021"
authors = ["Astor Rivera-Carcamo <astor@swtch.ai>"]
repository = "https://github.com/spacekit-xyz/spacekit-ai"

[workspace.dependencies]
growformer = { version = "0.1.0", path = "growformer", default-features = false }
growformer-ledger = { version = "0.1.0", path = "growformer-ledger" }
growformer-nca = { version = "0.1.0", path = "growformer-nca" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
