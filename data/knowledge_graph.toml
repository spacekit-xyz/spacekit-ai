# Growformer Topic Knowledge Graph
#
# Replaces hardcoded if-else chains in growformer_lang.rs with a declarative
# knowledge graph. Each node maps keyword patterns to a topic (for forced-topic
# routing) and a concept (for MetaConcept routing).
#
# Rule matching:
#   any    = at least one keyword must be present (OR)
#   all    = every keyword must be present (AND)
#   not    = none of these keywords may be present (NOT)
#   phrase = exact multi-word phrases (checked as substring)
#
# If a query matches multiple nodes, the highest priority wins.
# Within equal priority, the most specific rule (most `all` terms) wins.

