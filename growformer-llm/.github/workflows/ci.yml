name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Growformer LLM
        uses: actions/checkout@v4
        with:
          path: growformer-llm

      - name: Check out Growformer
        uses: actions/checkout@v4
        with:
          repository: spacekit-xyz/growformer
          path: growformer

      - name: Check out Growformer Ledger
        uses: actions/checkout@v4
        with:
          repository: spacekit-xyz/growformer-ledger
          path: growformer-ledger

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: growformer-llm
        run: cargo fmt --all -- --check

      - name: Check slim model
        working-directory: growformer-llm
        run: cargo check --no-default-features --features vanilla-lm,clifford-lm

      - name: Test
        working-directory: growformer-llm
        run: cargo test

