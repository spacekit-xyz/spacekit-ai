# Merged on top of knowledge_graph.toml when both live in the same directory.
# `topic` values must match lattice semantic_intent labels (e.g. mixed, positive_strong).
# Priority 14 sits below typical coding nodes (~18–20) so programming prompts still win.

[[nodes]]
topic = "mixed"
concept = "GeneralKnowledge"
category = "sentiment_nl"
priority = 14
[[nodes.rules]]
any = [
  "somehow i still feel",
  "still feel like today was fine",
  "at least the coffee",
  "paid today but",
  "half of it went",
  "portfolio is bleeding",
  "market is down again",
  "market opened red",
]
[[nodes]]
topic = "positive_strong"
concept = "GeneralKnowledge"
category = "sentiment_nl"
priority = 14
[[nodes.rules]]
any = [
  "remembered my coffee order",
  "meant more than anything",
  "six months of not seeing",
  "not seeing each other",
]

[[nodes]]
topic = "positive_strong"
concept = "GeneralKnowledge"
category = "sentiment_gaming_nl"
priority = 14
[[nodes.rules]]
any = [
  "we stomped",
  "gg no re",
  "enemy jungler",
  "carry was cracked",
  "almost boring",
]

[[nodes]]
topic = "sarcastic"
concept = "GeneralKnowledge"
category = "sentiment_nl"
priority = 14
[[nodes.rules]]
any = [
  "all-hands meeting",
  "read in an email",
  "oh brilliant, another",
  "nobody has reviewed my",
]

