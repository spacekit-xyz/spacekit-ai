# System 1 questions for the crypto sentiment project.
# Labels come from the existing training rows' `semantic_intent` field via `source`,
# so no new annotation is needed to train the fast heads.
# `definitions` are shown to the open model next to each option; it has never seen
# this project's label names, so they matter most for `intent`.

[[questions]]
id = "sentiment"
text = "What is the overall sentiment of this crypto text?"
type = "choice"
options = ["positive", "negative", "neutral", "mixed", "sarcastic"]
min_confidence = 0.5
[questions.definitions]
positive = "clearly good news or optimism, from mild relief to excitement"
negative = "losses, scams, frustration, fear or bearish news"
neutral = "factual, uneventful or uncertain; includes relief that something normal worked 'for once'"
mixed = "one clear positive and one clear negative point, often joined by 'but'"
sarcastic = "ironic or mocking; the literal words say the opposite of the meaning"

[questions.source]
field = "semantic_intent"
[questions.source.map]
positive_strong = "positive"
positive_mild = "positive"
cautiously_positive = "positive"
hopium = "positive"
euphoric = "positive"
negative_strong = "negative"
negative_mild = "negative"
cautiously_negative = "negative"
capitulation = "negative"
etf_delay_bearish = "negative"
copium = "negative"
neutral = "neutral"
neutral_chop = "neutral"
confused = "neutral"
mixed = "mixed"
sarcastic = "sarcastic"

[[questions]]
id = "bullishness"
text = "How bullish is this text for the asset it discusses?"
type = "score"
min = 0
max = 4
labels = ["very bearish", "bearish", "neutral or mixed", "bullish", "very bullish"]
[questions.source]
field = "semantic_intent"
[questions.source.map]
negative_strong = 0
capitulation = 0
negative_mild = 1
cautiously_negative = 1
etf_delay_bearish = 1
copium = 1
neutral = 2
neutral_chop = 2
confused = 2
mixed = 2
sarcastic = 2
cautiously_positive = 3
positive_mild = 3
hopium = 3
positive_strong = 4
euphoric = 4

[[questions]]
id = "bearish"
text = "Is this text bearish (negative for the asset)?"
type = "noul"
[questions.source]
field = "semantic_intent"
[questions.source.map]
negative_strong = true
negative_mild = true
cautiously_negative = true
capitulation = true
etf_delay_bearish = true
copium = true
positive_strong = false
positive_mild = false
cautiously_positive = false
hopium = false
euphoric = false
neutral = false
neutral_chop = false
confused = false
mixed = false
sarcastic = false

[[questions]]
id = "intent"
text = "Which fine-grained sentiment label fits best?"
type = "choice"
options = ["positive_strong", "positive_mild", "cautiously_positive", "hopium", "euphoric",
           "negative_strong", "negative_mild", "cautiously_negative", "capitulation",
           "etf_delay_bearish", "copium", "neutral", "neutral_chop", "confused", "mixed", "sarcastic"]
[questions.definitions]
positive_strong = "strongly bullish or very good outcome (major signal, big win, loss reframed as the best thing)"
positive_mild = "modestly good: a legitimate result, small win or relief"
cautiously_positive = "restrained optimism from early signals; 'something is brewing'"
hopium = "optimism driven by narrative or wishful thinking rather than fundamentals"
euphoric = "extreme hype: 'we're so back', vertical charts, bull-run excitement"
negative_strong = "catastrophic or total loss: drained wallets, life savings gone"
negative_mild = "frustration, broken promises, or a near-miss scam without real loss"
cautiously_negative = "wary suspicion; spots a scam or risk pattern and avoids it"
capitulation = "exhausted and giving up after repeated losses: 'I'm done'"
etf_delay_bearish = "Bitcoin selling off because a spot ETF decision was delayed"
copium = "counterfactual regret: 'if I had sold at the top', 'had they fixed it sooner'"
neutral = "factual or uneventful; relief that something normal worked 'for once'"
neutral_chop = "sideways, directionless, low-volume market"
confused = "unclear what is happening; uncertainty rather than anger"
mixed = "one clear positive and one clear negative point, often joined by 'but'"
sarcastic = "ironic or mocking tone; the literal words say the opposite"

[questions.source]
field = "semantic_intent"
