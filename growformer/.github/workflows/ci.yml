name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check lean runtime
        run: cargo check --no-default-features --bin growformer-runtime

      - name: Run library tests
        run: cargo test --lib

      - name: Run integration tests
        run: cargo test --test brain_merge --test causal_ordering_probe --test wasm_service_test

      - name: Compile Criterion benchmarks
        run: cargo bench --bench cosine_similarity --no-run

      - name: Verify publishable package
        run: cargo package --allow-dirty
