# First match wins: negation / rejection before positive idioms.
#
# English edges: common litotes get a tight positive_mild lexical row below; contrast still leans on
# contrastive_markers + bipolar tokens + training (MIXED / dominant-clause labels).
# Remaining: sarcasm, questions, hypotheticals, domain jargon, multilingual code-switching.



# Longer, high-precision phrases only — avoid short tokens that appear in neutral finance text.

# Full-line anchors for ironic crypto-demo prompts (CATA epoch drift can collapse these to MIXED without length-priority).
[[rules.lexical_polarity]]
topic = "sarcastic"
phrases = [
  "oh wonderful, another rebase token that definitely won't go to zero",
  "sure, because a token with 90% held by three wallets is definitely decentral",
]

[[rules.lexical_polarity]]
topic = "negative_strong"
phrases = [
  "absolutely hate", "utterly hate", "absolutely despise", "utterly despise",
  # Aversion to chain costs — short, high-signal n-grams (avoid full imperative demo lines).
  "despise the gas", "despise gas", "despise these gas", "despise paying gwei", "despise network fees",
  "despise on-chain fees", "loathe the gas", "loathe these fees", "despise transaction costs",
  # Staking economics — paraphrased “reward / APY shock” (no line-specific copy).
  "staking rewards dropped", "staking yield collapsed", "staking apy was slashed", "validator yield dropped",
  "emission got cut", "inflation got cut to", "incentives got slashed", "rewards just got slashed",
  # Staking bank-run + UI exit (longer than mild slang; wins `lexical_polarity` length tie).
  "staking rewards dropped from",
  "rewards were cut and suddenly",
  "the community is getting restless",
  "team keeps teasing",
  "keeps teasing the community",
  "complete scam", "total scam", "absolute scam", "pure scam",
  "absolute nightmare", "total nightmare", "complete nightmare", "pure nightmare",
  "worst experience of my life", "worst experience i've ever", "worst experience i have ever",
  "worst customer service i've ever", "worst customer service i have ever",
  "lost all trust", "lost every bit of trust", "lost complete faith",
  "completely unacceptable", "utterly unacceptable", "beyond unacceptable",
  "makes my blood boil", "made my blood boil",
  "never again under any circumstances", "never using this again", "never doing business with",
  "reporting them to the regulator", "filing a complaint with the regulator",
  "drained my account", "emptied my account", "wiped out my balance",
  "unauthorized wire", "unauthorised wire", "someone drained", "account takeover",
  # Terminal total-loss markers — veto any mild calibration. Catastrophic personal-loss phrasing.
  "lost their entire savings", "lost my entire savings", "lost his entire savings", "lost her entire savings",
  "lost the entire position", "lost my entire position",
  "lost everything to", "lost everything in", "lost all my", "lost every cent",
  "lost my life savings", "lost their life savings", "lost his life savings", "lost her life savings",
  "drained every wallet", "drained every account",
  "wiped out my portfolio", "wiped out thousands", "wiped out every position",
  "every token gone", "every stake drained",
  "cleaned out my wallet", "cleaned out every account",
  "nothing left", "there is nothing left", "there's nothing left", "nothing recoverable",
  # Pre-exploit insider movement — strong causal signal of fraud / rug pull.
  "before the exploit was announced", "before the exploit became public",
  "before the hack was disclosed", "before the hack went public",
  "hours before the exploit", "minutes before the exploit",
  "hours before the hack", "minutes before the hack",
  "morning of the rug", "before the rug pull", "before the rug",
  "classic exit scam", "textbook exit scam", "classic rug pull",
  "so much for decentralization", "so much for the decentralization",
]

# Slang frustration register — keep short; longer matches live in `negative_strong` above
# ("community is getting restless", "wen" + teasing) so strength wins the length tie.
[[rules.lexical_polarity]]
topic = "negative_mild"
phrases = [
  "restless ngl",
  "restless holders",
  "wen listing", "wen mainnet", "wen token",
  "keep teasing",
  "same soon answer", "same 'soon' answer",
  "ngl this team", "ngl the team",
