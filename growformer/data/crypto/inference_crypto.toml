# -----------------------------------------------------------------------------
# Headline lexical + lattice misfire (aligned with `data/sentiment/inference_sentiment.toml`).
# Fintech training / `--project` should point `[inference].toml` here; discovery also tries this
# path when `GROWFORMER_INFERENCE_TOML` / CLI primary are unset (see `inference_toml_rel_search_order`).
# -----------------------------------------------------------------------------
#
# High-priority wire rules (first match wins within after_pr_wire=false): place before generic buckets.
#
# Clifford + CATA: routing fixes for OOD / imperative / technical lines and contrastive L2+bridge demos.
# (Order matters: first match wins in scan_headline_lexical_topic.)

# Technical / non-sentiment — NOT negative despite embedding drift
[[rules.headline_lexical_topic]]
topic = "neutral"
min_trim_len = 25
intent = [
  ["sha-256", "sha256", "256-bit", "256 bit"],
  ["digest", "produces a", "hash function", "256-bit digest"],
  ["produces", "regardless", "function"],
]

[[rules.headline_lexical_topic]]
topic = "neutral"
min_trim_len = 20
intent = [
  ["list the top", "list top "],
  ["market cap", "capitalization", "by market cap"],
  ["crypto", "cryptocurrency"],
]

[[rules.headline_lexical_topic]]
topic = "neutral"
min_trim_len = 20
intent = [
  ["convert "],
  ["usdt", "usdc", "btc", "eth"],
  ["market price", "at current market", "current price", "at spot"],
]

# "Wen" + airdrop-type delay + on-chain community venting (strong frustration, not mild FOMO).
[[rules.headline_lexical_topic]]
topic = "negative_strong"
min_trim_len = 30
intent = [
  ["wen airdrop", "wen listing", "wen mainnet", "wen token"],
  ["teasing", "keeps teasing", " keeps "],
  ["restless", "ngl", "sick of waiting", "tired of waiting", "tired of the", "getting restless", " community "],
]

# Incentive cut + run/bank-run behavior on the exit (stabilize vs NEUTRAL on long clauses).
[[rules.headline_lexical_topic]]
topic = "negative_strong"
min_trim_len = 20
intent = [
  ["stake", "staking", "validator", "staker", "rewards "],
  ["dropped", "fell to", "slashed", "from ", " to "],
  ["unbond", "unlock", "unstake", "discover", " discovered", " everyone", " queue", "rushed to unbond", "rushed the"],
]

# L2 + bridging contrast — user complaint about bridge cost, not one-sided NEG
[[rules.headline_lexical_topic]]
topic = "mixed"
min_trim_len = 30
intent = [
  ["layer 2", "l2 "],
  ["but ", "mainnet", "bridge", "bridging "],
  ["lunch", "back to mainnet", "still costs", " sub-cent "],
]

# Regulator + regulatory outcome vs funds already moved — dual valence
[[rules.headline_lexical_topic]]
topic = "mixed"
min_trim_len = 20
intent = [
  ["sec "],
  ["emergency", "freeze", "token sale", "filing "],
  [" but ", "already", " left "],
]

# Strong aversion to chain-level costs (emotion verb + fee / gas / gwei surface).
# (No `require_crypto_lexicon`: "gas"/"gwei" are not in the surface list but are domain-defining here.)
[[rules.headline_lexical_topic]]
topic = "negative_strong"
min_trim_len = 10
intent = [
  ["despise", "loathe", "despise the", "despise these", "despise paying"],
  [
    " gas", "gwei", "fees", "in fees", " fee", "base fee", "priority fee", "mainnet", "l1", "l1 cost",
    "transaction cost", "network fee", "on-chain", "on l1",
  ],
]

# Validator / staking yield compression — multi-clause "rewards / APY cut" stories (often with exit mechanics).
[[rules.headline_lexical_topic]]
topic = "negative_strong"
min_trim_len = 20
intent = [
  ["stake", "staking", "validator", "staked", "emission", "inflation rate"],
  ["dropped", "slashed", "reduced", "from ", " to ", " cut", "collapsed", "fell from", "fell to", "diluted", "dilution", "gutted", "gutting"],
  ["apy", "reward", "rewards", "yield", "percent", "%", " bps", "incentive", "rate"],
]

# Reward schedule + unbonding / lockup language in the same line (exit friction after a cut).
[[rules.headline_lexical_topic]]
topic = "negative_strong"
min_trim_len = 18
intent = [
  ["stake", "staking", "validator", "staked"],
  ["reward", "rewards", " apy", "emission", " yield", "yield", "incentive", "rate"],
