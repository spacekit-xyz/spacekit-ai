# -----------------------------------------------------------------------------
# Headline lexical + lattice misfire (aligned with `data/sentiment/inference_sentiment.toml`).
# Fintech training / `--project` should point `[inference].toml` here; discovery also tries this
# path when `GROWFORMER_INFERENCE_TOML` / CLI primary are unset (see `inference_toml_rel_search_order`).
# -----------------------------------------------------------------------------
#
# High-priority wire rules (first match wins within after_pr_wire=false): place before generic buckets.



# -----------------------------------------------------------------------------
# Headline lexical + lattice misfire (aligned with `data/sentiment/inference_sentiment.toml`).
# Fintech training / `--project` should point `[inference].toml` here; discovery also tries this
