  "slick", "seamless", "snappy", "polished", "nifty",
]

negative_anchor_tokens = [
  "hate", "despise", "loathe", "awful", "terrible", "worst", "horrible", "bad",
  "sucks", "disgusting", "dislike", "miserable", "depressing",
