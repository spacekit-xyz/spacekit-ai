# Traditional Fintech inference TOML — domain-specific rules for equities, banking, corporate finance.
# Merged with inference_sentiment_core.toml at runtime via merge_empty_from.
# -----------------------------------------------------------------------------

meta_gk_margin = 0.05
meta_gk_confidence = 0.55
min_meta_confidence_user_anchored = 0.28
mixed_override_confidence = 0.88
default_line_confidence = 0.92
ambiguous_line_confidence = 0.58

[rules]
contrastive_markers = [
  " but ", ", but ", ". but ", " although ", " even though ", " however ", "; but ",
  " on the other hand ", " on the flip side ", " that said ", " having said that ",
  " with that said ", " at the same time ", " then again ", " still, ", " all that said ",
  " even so ", " mind you ", " in the same breath ",
  # Surprise / skepticism bridge (ellipsis or comma before “which”)
  " which is weird", " weird because", " strange that", " odd that",
  " though ", ", though ", ". though ",
  " shame that", " shame ",
]

sarcasm_simple = [
  "yeah, because", "sure, because", "right, because",
  "gotta love when", "meritocracy at its finest", "genius move", "living the dream",
  "isn't it just perfect", "isnt it just perfect",
  "thanks for ghosting", "thanks for the zero notice",
  "clearly i'm the problem", "clearly im the problem",
  "thanks for the overdraft", "thanks for the fee", "great time to freeze my account",
  "love when my card gets declined", "perfect timing on that maintenance window",
  "oh great, another", "oh great, another maintenance", "exactly what i needed today",
]

positive_anchor_tokens = [
  "love", "adore", "treasure", "obsessed", "enjoy", "like", "prefer", "best", "great",
  "amazing", "wonderful", "fantastic", "excellent", "happy", "glad", "good", "nice",
  "fine", "better", "beautiful", "incredible", "perfect",
