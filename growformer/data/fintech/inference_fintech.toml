# Gang / criminal jailed — negative crime story.

# -----------------------------------------------------------------------------
# PR / wire / press headline → neutral
#
# Third-person, no evaluative adjective, no first-person pronouns.
# These patterns route factual fintech-news headlines to NEUTRAL before
# the lattice (trained on first-person desk chatter) can return a wrong
# positive or negative neighbor.
#
# Intent format (CNF): every inner array is an OR-group; ALL groups must match.
# e.g. [["launches", "launch"], ["platform", "card", "wallet"]]
#   → text must contain (launches OR launch) AND (platform OR card OR wallet).
# -----------------------------------------------------------------------------

# --- Product / feature launches ---
[[rules.pr_wire_neutral_intent]]
intent = [["launches", "launch", "launched", "launching", "debuts", "debuted", "unveils", "unveiled", "rolls out", "rolled out", "introduces", "introduced"]]

