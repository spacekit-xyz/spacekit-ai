# --- Prefix-style rules ---

# "How is X Ensuring / Boosting / Driving" — magazine feature title, not question
[[rules.pr_wire_neutral_prefix]]
prefix = "how "
min_len = 40
exclude_prefixes = [
  "how do ", "how can ", "how much", "how long",
  "how does ", "how did ", "how will ", "how should ",
  "how could ", "how would ", "how are you",
  "how is it ", "how is this ", "how is that ", "how is the ",
  "how to ",
]

# "Who is X, Lloyds' New Chief" — profile feature title
[[rules.pr_wire_neutral_prefix]]
prefix = "who is "
min_len = 20

# "Why is eToro Acquiring…" — editorial question headline
[[rules.pr_wire_neutral_prefix]]
prefix = "why "
min_len = 40
disallow_question_mark = true
exclude_prefixes = [
  "why do ", "why can ", "why should ", "why would ",
  "why did ", "why does ", "why will ",
  "why is my ", "why are my ", "why was my ",
  "why won't ", "why wont ", "why not ", "why to ",
  "why can't i ", "why cant i ",
  "why is it ", "why is this ", "why is that ", "why is the ",
  "why the charge", "why the app ", "why my ", "why did my ",
  "why won't my ", "why wont my ",
]
require_any = [
  "fintech", "funding", "venture", "valuation", "startup",
  " ipo", " ai", "bank", "payments", "crypto ", "blockchain",
  "acquiring", "acquisition",
]
