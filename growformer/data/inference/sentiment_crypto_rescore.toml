# Declarative retrieval rescore for sentiment lattice when the query looks like crypto/tape.
# Schema: see `inference::retrieval_rescore`. Add locale-specific tables later (e.g. sentiment_crypto_rescore.fr.toml).
# Do not add new English heuristics in Rust — extend this file or ship a WASM plugin (see docs/RETRIEVAL_EXTENSIBILITY.md).

version = 1
locale = "en"

[[rules]]
id = "fintech_consumer_noise"
# Down-rank payment/fraud templates that collide on generic tokens.
when_program_any = [
  "security friction",
  "patient assistance leading to resolution",
  "networking — patient",
  "gratitude without intensity",
  "slightly improved performance",
  "everyday purchase misclassified",
  "fraud system blocked",
  "fraud system flagged",
  "fraud team flagged",
  "payment got flagged but at least",
  "notified me instantly",
  "my bank finally added alerts",
  "my payment got flagged",
  "merchant says pending",
]
delta = -0.38

