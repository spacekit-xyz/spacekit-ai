# Layer 0 — typed world grounding graph (MVP scaffold)
# Versioned, read-only at inference. Expands subject keywords for BM25 / witness alignment
# (see GROWFORMER_CAUSAL_AI.md — World grounding; inference::world_grounding).
#
# ---------------------------------------------------------------------------
# Edge kinds (auditable; traversal scales weight by kind — see Rust `kind_multiplier`)
# ---------------------------------------------------------------------------
#   is_a                 — taxonomic parent; strongest propagation (×1.25)
#   adjacent_to          — domain co-occurrence / soft association (×1.0)
#   sentiment_bearing    — valence bucket token (e.g. positive, negative); BM25 expansion + retrieval
#                          conditioning nudge (Stage‑1 cosine) when an empirical axis is available
#   causal_type          — target names a causal frame (aligns with causal JSONL / gfcausal_*)
#   domain               — assigns a domain bucket token for retrieval
#   disambiguated_by     — no hop by itself; marks context cues. If any match the query,
#                          zero-weight `adjacent_to` edges on the *same* node may unlock
#                          (see `requires_context` on those edges).
#
# ---------------------------------------------------------------------------
# Node fields
# ---------------------------------------------------------------------------
#   magnitude_sensitive = true — loss/gain/currency-style nodes; logged for future conditioning
#   causal_anchor       = true — optional hint for tooling (reserved; not required for traversal)
#
# Zero-weight `adjacent_to` + `requires_context = "<id>"`:
#   Unlocks only when that context id matched (token, activated root, or substring on padded intent).

version = 1

