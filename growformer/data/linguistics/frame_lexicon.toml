# Declarative frame → scenario-topic map (linguistics brain Phase 1).
# `scenario_topic` feeds forced-topic lattice retrieval; `frame_id` is the stable semantic name.

[[frames]]
frame_id = "ETF_DELAY_BEARISH"
scenario_topic = "etf_delay_bearish"
intent = [
  ["bitcoin", "btc", " spot btc", "crypto"],
  ["etf", " etf", "spot etf"],
  ["crash", "crashed", "sell-off", "selloff", "dump", "plunged", "fell", "slid", "slide", " broke down"],
  ["delay", "delayed", "postpon", "shelved", "shelf", "pushed back", "slipped", "approval", "decision", "hearing"],
]

[[frames]]
frame_id = "MORTGAGE_RATE_COMPLAINT"
