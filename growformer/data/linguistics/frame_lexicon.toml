# Hard-reject: counterfactual positive — not a bearish headline bucket.
[[reject_frames]]
frame_id = "COUNTERFACTUAL_POSITIVE"
intent = [
  ["would have", "would've", "would have loved", "wish i had"],
  ["rally", "moon", "pump", "gain", "green", "loved that"],
]
