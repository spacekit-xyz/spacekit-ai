[[rules.objective_fact_rules]]
requires_digit = true
all = []
any = [
  "treasury yield", "10-year", "10 year", "30-year", "30 year",
  "2-year", "2 year", "5-year", "5 year",
  "basis points", "bps",
  "gdp ", "cpi ", "ppi ",
]

# Instructional / definitional prompts (no evaluative stance) → NEUTRAL in user-anchored shortcut path.
[[rules.objective_fact_rules]]
requires_digit = false
all = ["list "]
any = ["iso ", "annex", "control"]

[[rules.objective_fact_rules]]
requires_digit = false
all = ["define "]
any = ["term", "harmony", "voice-leading", "voice leading"]

[[rules.objective_fact_rules]]
requires_digit = false
all = []
any = ["nominal", "ac voltage", "split-phase", "split phase", "north america"]

# -----------------------------------------------------------------------------
# Minimal headline lexical rows (everyday register). Merged packs append more rows
# (see `InferenceRulesSection::merge_empty_from`); keep at least one row so core-only
# `--infer` (no `--inference-toml` / project) still routes long eval lines like the sunset prompt.
# -----------------------------------------------------------------------------

[[rules.headline_lexical_topic]]
topic = "neutral"
intent = [
  ["the sunset was average", "sunset was average"],
  ["instagram-worthy", "instagram worthy"],
]

# -----------------------------------------------------------------------------
# PR / wire → neutral (edit here; Rust only evaluates prefix + CNF rules).
# -----------------------------------------------------------------------------

[[rules.pr_wire_neutral_prefix]]
prefix = "how "
min_len = 40
exclude_prefixes = [
  "how do ",
  "how can ",
  "how much",
  "how long",
  "how does ",
  "how did ",
  "how will ",
  "how should ",
  "how could ",
  "how would ",
  "how are you",
  "how is it ",
  "how is this ",
  "how is that ",
  "how is the ",
  "how to ",
]

[[rules.pr_wire_neutral_prefix]]
prefix = "why "
min_len = 40
disallow_question_mark = true
exclude_prefixes = [
  "why do ",
