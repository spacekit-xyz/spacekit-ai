# Longer, high-precision phrases only — avoid short tokens that appear in neutral finance text.
[[rules.lexical_polarity]]
topic = "negative_strong"
phrases = [
  "absolutely hate", "utterly hate", "absolutely despise", "utterly despise",
  "complete scam", "total scam", "absolute scam", "pure scam",
  "absolute nightmare", "total nightmare", "complete nightmare", "pure nightmare",
  "worst experience of my life", "worst experience i've ever", "worst experience i have ever",
  "worst customer service i've ever", "worst customer service i have ever",
  "lost all trust", "lost every bit of trust", "lost complete faith",
  "completely unacceptable", "utterly unacceptable", "beyond unacceptable",
  "makes my blood boil", "made my blood boil",
  "never again under any circumstances", "never using this again", "never doing business with",
  "reporting them to the regulator", "filing a complaint with the regulator",
  "drained my account", "emptied my account", "wiped out my balance",
  "unauthorized wire", "unauthorised wire", "someone drained", "account takeover",
  # Context disambiguation: "disgusting" defaults negative outside gaming slang.
  # Gaming context (play/outplay/mechanics + GG/carry/cracked) stays routed via gaming lattice.
  "that was disgusting", "absolutely disgusting", "truly disgusting",
  "disgusting behavior", "disgusting behaviour", "disgusting service",
  "disgusting food", "disgusting meal", "disgusting restaurant",
  "disgusting experience", "disgusting performance",
  "the play was disgusting", "the movie was disgusting", "the show was disgusting",
  "the film was disgusting",
