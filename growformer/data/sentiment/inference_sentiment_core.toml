  "apology felt rehearsed", "apology sounded rehearsed",
  "felt rehearsed", "sounded rehearsed",
  "none of them landed", "none of it landed",
  "the right words in the right order but", "right words in the right order but",
  "comment stung more than", "stung more than",
  # Damaged / defective product complaints — plain negative, not product-rejection rhetoric.
  "arrived damaged", "arrived with a huge dent", "arrived broken",
  "huge dent on the side", "huge dent", "dent on the side",
  "packaging was clearly insufficient", "packaging was insufficient",
  "damaged with a huge dent",
  # Sardonic interpersonal rejection — "getting the message loud and clear" is decoding silence as
