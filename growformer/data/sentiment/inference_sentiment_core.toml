  "mass layoffs", "announced mass layoffs", "mass redundancies",
  "covenant breach", "covenant violation",
  "trust eroded", "trust has eroded", "trust eroding",
  "data breach", "data leak", "data exposed",
  "morale has cratered", "morale cratered", "morale collapsed",
  # Degree-modifier + evaluative word combos — explicit entries so the modifier chain fires.
  "deeply disappointed", "profoundly disappointed", "utterly disappointed",
