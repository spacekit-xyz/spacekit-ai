# Customer-safe inference defaults (numeric gates + structural [rules] lists only).
# -----------------------------------------------------------------------------
# A minimal `[[rules.headline_lexical_topic]]` table is included for everyday lines that
# must beat coarse mixed heuristics without loading the full reference pack.
# For the full internal sentiment pack (tests, `sentiment-analysis` script), use
# `inference_sentiment_reference.toml` via `--inference-toml` / `[inference].toml`.
#
# Built-in discovery prefers this file first (see `inference_toml.rs`). Omitted or empty
# `[rules]` arrays merge from `--inference-defaults-toml` / baseline search when set.
# -----------------------------------------------------------------------------

meta_gk_margin = 0.05
meta_gk_confidence = 0.55
min_meta_confidence_user_anchored = 0.28
mixed_override_confidence = 0.88
default_line_confidence = 0.92
ambiguous_line_confidence = 0.58

[rules]
contrastive_markers = [
  " but ", ", but ", ". but ", " although ", " even though ", " however ", "; but ",
  " on the other hand ", " on the flip side ", " that said ", " having said that ",
  " with that said ", " at the same time ", " then again ", " still, ", " all that said ",
  " even so ", " mind you ", " in the same breath ",
  " which is weird", " weird because", " strange that", " odd that",
  " though ", ", though ", ". though ",
  " shame that", " shame ",
]

sarcasm_simple = [
  "yeah, because", "sure, because", "right, because",
  "gotta love when", "meritocracy at its finest", "genius move", "living the dream",
  "isn't it just perfect", "isnt it just perfect",
