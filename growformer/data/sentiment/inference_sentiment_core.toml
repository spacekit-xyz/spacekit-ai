  "not fond of", "am not fond", "i'm not fond", "im not fond",
  "not good enough", "not good at", "nowhere near as good",
  "wouldn't use", "wouldnt use", "won't use", "wont use", "will not use",
  "don't use", "dont use", "do not use", "doesn't use", "doesnt use",
  "shouldn't use", "shouldnt use", "should not use",
  "wouldn't touch", "wouldnt touch", "won't touch", "wont touch",
  "can't stand", "cant stand", "cannot stand",
  "wouldn't recommend", "wouldnt recommend", "won't recommend", "wont recommend",
  "don't recommend", "dont recommend", "don't trust", "dont trust",
  "hardly recommend", "can't recommend", "cant recommend", "cannot recommend",
  "not interested in using", "don't want to use", "dont want to use",
  "prefer not to", "rather not", "no thanks",
  "not going to use", "stopped using", "quit using", "switching away from",
  "never use again", "never using again",
  "avoid using", "stay away from",
  "could do without", "can do without",
  "wish i hadn't", "wish i had not", "wish i never",
  "regret using", "regret buying", "regret trying",
  "waste of money", "waste of time", "waste of ",
  "rip off", "rip-off",
  "overrated", "underwhelmed", "underwhelming",
  "dissatisfied", "unhappy with", "frustrated with", "annoyed with",
  "sick of", "tired of", "fed up", "fed up with", "had enough of",
  "not for me", "not what i expected", "not what i hoped",
  "not worth it", "not worth the", "not worth using",
  "falls short", "left a lot to be desired", "leaves a lot to be desired",
  "wouldn't buy", "wouldnt buy", "won't buy again", "wont buy again",
  "never buying again", "not buying again", "won't purchase again", "wouldn't purchase again",
  "will not buy again", "won't be buying", "wont be buying", "not worth buying",
