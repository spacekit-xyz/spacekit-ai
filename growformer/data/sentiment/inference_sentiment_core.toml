  "can't access my", "cant access my", "locked out of my", "locked me out of",
  "declined at checkout", "declined again", "keeps declining",
  "where's my money", "wheres my money", "where is my money",
  "false positive fraud", "wrongfully flagged", "mistaken fraud alert",
  # Everyday friction with dark-humor hedge — reads as mild complaint, not neutral observation.
  # ("i have chosen violence. just kidding. barely." flattens the stance to grudging annoyance.)
  "i have chosen violence. just kidding. barely",
  "i have chosen violence. just kidding",
  "drilling at 7am on a sunday",
  "drilling at 7 am on a sunday",
  # Rehearsed / hollow apology — the lexicon for "stung", "rehearsed", "none of them landed" is the
