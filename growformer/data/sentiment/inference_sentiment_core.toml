topic = "negative_mild"
phrases = [
  "don't like", "dont like", "do not like",
  "doesn't like", "doesnt like", "didn't like", "didnt like", "did not like",
  "don't love", "dont love", "don't enjoy", "dont enjoy", "don't prefer", "dont prefer",
