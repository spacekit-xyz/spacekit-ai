# First match wins: negation / rejection before positive idioms.
#
# English edges: common litotes get a tight positive_mild lexical row below; contrast still leans on
# contrastive_markers + bipolar tokens + training (MIXED / dominant-clause labels).
# Remaining: sarcasm, questions, hypotheticals, domain jargon, multilingual code-switching.
