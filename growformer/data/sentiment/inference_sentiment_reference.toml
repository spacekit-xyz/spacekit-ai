# Internal sentiment reference pack (headline rules, PR-wire examples, lattice misfire fixtures).
# -----------------------------------------------------------------------------
# Not used as the anonymous default — point your project here explicitly, e.g.
# `scripts/sentiment-analysis.gf.toml` → `[inference].toml = "../data/sentiment/inference_sentiment_reference.toml"`.
# Customers who only need thresholds + lexical scaffolding should use `inference_sentiment_core.toml`.
# -----------------------------------------------------------------------------

meta_gk_margin = 0.05
meta_gk_confidence = 0.55
min_meta_confidence_user_anchored = 0.28
mixed_override_confidence = 0.88
default_line_confidence = 0.92
ambiguous_line_confidence = 0.58

