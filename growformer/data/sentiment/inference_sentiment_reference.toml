  "not terrible actually", "wasn't terrible", "wasnt terrible",
  "not awful actually", "wasn't awful", "wasnt awful",
  "could have been worse", "it could have been worse",
  "is not bad", "was not bad", "are not bad", "were not bad",
  # Ahead-of-expectation money flow — mild positive on partial lines (no explicit “love/great”).
  "earlier than expected", "sooner than expected", "faster than expected",
  "ahead of schedule",
  "posted early", "cleared early", "credited early", "settled early",
  "deposit hit early", "paycheck hit early", "payment hit early",
