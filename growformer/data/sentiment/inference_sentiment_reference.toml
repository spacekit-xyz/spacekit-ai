# -----------------------------------------------------------------------------
# Headline lexical overrides (first matching `intent` CNF wins). Phrases live here,
# not in `InferenceRulesRuntime` Rust — edit data or retrain instead of hardcoding.
# -----------------------------------------------------------------------------

# --- Everyday register (before confused / wire heuristics) ---
[[rules.headline_lexical_topic]]
topic = "neutral"
intent = [
  ["the sunset was average", "sunset was average"],
  ["instagram-worthy", "instagram worthy"],
]

# --- Informational / uncertainty (before domain crime & wire heuristics) ---
[[rules.headline_lexical_topic]]
topic = "confused"
require_question_mark = true
intent = [
  ["is it normal", "is this normal", "should i worry", "should i be worried", "is that normal"],
  ["jump", "jumps", "went up", "gone up", "increased", "increase "],
]
