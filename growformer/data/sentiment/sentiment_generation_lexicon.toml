# English strings for sentiment lattice generation (witness gates, OOD fallback, hard-reject).
# Loaded at runtime from embed; extend [locales.en] for other locales later.
# See `inference::sentiment_generation_lexicon`.

version = 1
default_locale = "en"

[locales.en]
# Shown in prompt-anchored fallback and matched by `LanguageService` for fast-path / metacog skip.
prompt_anchor_marker = "No witness-matched lattice row for this wording"

# Excluded from witness keyword overlap (too generic; false positives vs unrelated rows).
witness_weak_forms = [
  "even", "again", "still", "just", "also", "then", "very", "most", "some", "well",
  "back", "long", "high", "fast", "late", "last", "next", "first", "same", "such",
  "much", "many", "less", "more", "here", "there", "only", "once", "ever", "never",
]

# Stopwords for prompt-anchored cue excerpt (subject + intent tokens).
excerpt_stopwords = [
  "the", "and", "with", "that", "this", "from", "into", "your", "were", "have", "has",
  "been", "about", "their", "they", "what", "when", "where", "will", "would", "could",
  "for", "are", "was", "but", "not", "out", "over", "than", "then", "some", "such",
  # Generic valence tokens: label already states POSITIVE/NEGATIVE; keeps wire excerpts honest.
  "positive", "negative",
]

# Cue tokens containing or starting with these are dropped from excerpts.
internal_cue_prefixes = ["gfcausal", "growformer", "money_usd_"]

# Topic keys that may use sentiment sub-lattice + prompt-anchored fallback (not identity / coding).
sentiment_lattice_topic_hints = [
  "negative_mild", "negative_strong", "positive_mild", "positive_strong",
  "neutral_chop", "neutral", "mixed", "confused", "sarcastic", "euphoric",
  "copium", "hopium", "capitulation", "cautiously_positive", "cautiously_negative",
  "cautiously_optimistic", "grateful_but_cautious", "formal_complaint", "dry_humor",
  "impressed_but_skeptical", "resigned_annoyance", "polite_negative", "disappointed", "resigned",
  # Scenario retrieval buckets (narrower than polarity-only negative_mild).
  "etf_delay_bearish", "mortgage_rate_complaint", "fee_complaint",
]

# If decoded lattice text contains any of these (ASCII-lowercased), hard-reject the program.
# Structural / repetition checks stay in Rust (`hard_reject_repeated_bigram`, etc.).
hard_reject_substrings = [
  "[mask]", "mask]", "mask][", "][", "[]",
  "growformer agent", "growformer companion", "companion agent", "i am growformer",
  "specialized ai agent", "built by swtch", "swtch.ai",
  "biologically-inspired neural", "biologically inspired neural",
  "neurons exist in 3d", "synapses grow and prune",
  "self-organizing neural", "self organizing neural",
  "drawn to curiosity",
  "knowledge is encoded as physical neural structure",
  "people their people", "their people their",
  "details people details", "people details people", "people share people",
  "headline snack",
  "my intelligence comes from structure", "not weight optimization", "friendly companion",
  "share a moment of curiosity", "i was created to be",
  "about. about",
  "taxpayer friction",
  "poor pressure messaging",
  "pressure messaging non confusion",
  "not a consumer- win story",
