# Bodies for [`lattice_shortcuts::try_user_anchored_line`] when `lexical_polarity_override` fires
# (topic key from longest `[[rules.lexical_polarity]]` match). Keeps product-litotes vs rejection copy honest.
[locales.en.lattice_lexical_override_bodies]
positive_strong = "Strong positive idiom (e.g. 'blew me away') — read as enthusiastic praise despite weak topic scores"
positive_mild = "Understated or litotic approval — read as POSITIVE (mild); not a commerce-rejection read"
negative_mild = "Clear non-repeat / rejection stance (e.g. wouldn't buy again) — negative on the product or experience, not praise"
negative_strong = "Strong rejection or harm — read as clearly negative on the product or experience, not praise"
etf_delay_bearish = "Spot ETF delay or approval slip driving a Bitcoin/crypto sell-off — bearish headline, not counterfactual rally skepticism"
mortgage_rate_complaint = "First-person mortgage or home-loan rate hike without adequate notice — consumer complaint, not custody-fee desk copy"
fee_complaint = "Recurring bank or custody fee grievance — not a mortgage-rate hike"
neutral = "Compensating factors or hedged stance without a single emotional pole — read as NEUTRAL"
mixed = "Contrastive or dual-valence wording — read as MIXED when both relief and friction (or similar poles) appear in the same line; not a single clean pole"

# Fine-grained topic → coarse bucket when emitting routing-only copy (no lattice witness).
[locales.en.routing_coarse]
# Wire headlines misclassified as identity still use sentiment lattice copy — coarse header only.
