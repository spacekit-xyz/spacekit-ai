# Sentiment lattice micro-brain — run from the growformer crate root, or adjust paths.
# Example train:
#   cargo run --release -- --train-brain --project scripts/sentiment-analysis.gf.toml
# Example infer (uses [infer].brain if you omit --brain):
#   cargo run --release -- --infer --project scripts/sentiment-analysis.gf.toml --prompt 'I love it'

schema_version = 1

[project]
name = "SentimentAnalysis"
author = "Astor Rivera"
description = "Sentiment analysis micro-brain. Classifies text into positive (strong/mild), negative (strong/mild), neutral, mixed, and sarcastic with reasoning."

[train]
auto = true
data_dir = "../data/sentiment"
brain_output = "../agent-data/sentiment-analysis/sentiment-brain-v3.bin"
brain_plugins_toml = "../data/plugins/example-brain-plugins.toml"

[inference]
toml = "../data/sentiment/inference_sentiment_core.toml"

[infer]
brain = "../agent-data/sentiment-analysis/sentiment-brain-v3.bin"
