]

[[fragment_compose.intent_rules]]
id = "owner_distress"
intent = "grounding_support"
anchors = ["grounding_support", "emotional_support", "comfort_seeking", "reassurance_seeking"]
min_voices = 1
relaxed_parts = true
match = "contains_any"
patterns = [
  "i feel floaty", "feel floaty", "i'm losing patience", "im losing patience",
