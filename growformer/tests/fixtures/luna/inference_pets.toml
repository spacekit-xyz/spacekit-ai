intent = "school_stress"
anchors = ["school_stress", "emotional_support", "comfort_seeking", "reassurance_seeking"]
min_voices = 1
relaxed_parts = true
match = "contains_any"
patterns = [
  "school", "grades", "homework", "failed a test", "failed my test",
  "bad grades", "terrible day at school", "awful day at school",
  "school was awful", "test today", "math class", "teacher",
]

[[fragment_compose.intent_rules]]
id = "help_me"
intent = "grounding_support"
anchors = ["grounding_support", "emotional_support", "reassurance_seeking", "comfort_seeking"]
min_voices = 1
relaxed_parts = true
match = "contains_any"
patterns = [
  "help me", "i need help", "need your help", "please help",
]

[[fragment_compose.intent_rules]]
id = "owner_im_distress"
intent = "emotional_support"
anchors = ["emotional_support", "grounding_support", "comfort_seeking", "reassurance_seeking"]
min_voices = 1
relaxed_parts = true
match = "starts_with_any"
patterns = [
