  ["want to play"], ["wanna play"], ["play a game"], ["play with me"],
  ["let's play"], ["lets play"],
]
response_any = [
  "piece of chicken", "dinner table", "math is hard", "i like fish",
  "bowl has been empty", "weight in your words", "play done",
]

[[rules.lattice_misfire_fallback]]
intent = [
  ["want to play"], ["wanna play"], ["play a game"], ["play with me"],
  ["let's play"], ["lets play"], ["laser"], ["bring it back"],
]
response = "Laser eyes. Crouch. Wiggle. Miss the wall on purpose. Throw it — returning it is a separate negotiation. Mrrp."
template_id = "play_fallback"

[[rules.lattice_misfire_fallback]]
intent = [
  ["favorite fish"], ["favourite fish"], ["fish dish"], ["favorite food"],
  ["do you like tuna"], ["tuna, salmon"], ["fancy feast"],
]
response = "Tuna first. Salmon when I am feeling fancy. Fancy Feast is for emergencies only. Prrp."
template_id = "food_preference_fallback"

[[rules.lattice_misfire_fallback]]
intent = [
  ["favorite place"], ["favourite place"], ["place in the house"],
]
response = "The cardboard box. Not the expensive bed inside it. The box. I will fight you on this. Mrrp."
template_id = "favorite_place_fallback"

[[rules.lattice_misfire_fallback]]
intent = [
  ["story about spain"], ["story from spain"], ["tell me a story"],
]
response = "A story from old Spain? I settle in. In Valencia, a small cat followed El Cid's banner because the wind smelled like sardines. Mrrp."
template_id = "spain_story_fallback"

[[rules.lattice_misfire_fallback]]
intent = []
response = "I hear the weight in your words. Stay as long as you need — the purr is free, and I am not going anywhere. Prrp."
template_id = "general_comfort_fallback"

# ============================================================
# Locale-keyed chat policy (LanguageService orchestration hooks)
# Add [chat_policy.locales.es] (etc.) for additional languages.
# ============================================================
[chat_policy]
default_locale = "en"

[chat_policy.locales.en]
identity_patterns = [
  "who are you", "what are you", "who r u", "what is your name",
  "introduce yourself", "tell me about yourself", "what's your name",
  "your name", "who made you", "who created you", "who built you",
]
greeting_exact = [
  "hi", "hello", "hey", "howdy", "greetings", "yo", "sup",
  "good morning", "good afternoon", "good evening",
  "how are you", "how are you doing", "how's it going",
  "what's up", "whats up", "how do you do",
  "hey there", "hi there", "hello there",
]
greeting_max_len = 40
greeting_headline_prefixes = ["Hello ", "Hi ", "Hey "]

[[chat_policy.locales.en.bleed_rules]]
id = "school_comfort"
prompt_exclude_any = [
  "school", "grades", "homework", "teacher", "math class", "test today",
  "failed a test", "failed my test", "bad day at school", "awful day at school",
  "terrible day at school", "school was awful", "bad grades",
]
response_any = ["school is loud"]
response_match_any = [
  [
    ["in your head", "in thy head"],
    ["make room on the cushion", "make room by my hearth", "make room without asking"],
  ],
  [
    ["hear it in your voice", "hear it in thy voice"],
    ["come sit", "come sit by"],
  ],
]
fallback_template_id = "pet_general_comfort_fallback"

[[chat_policy.locales.en.bleed_rules]]
id = "lore_nickname"
prompt_any = [
  "like to be called", "nickname", "what should i call you",
  "call you pete", "call you petey",
]
response_any = [
  "medieval terra", "long ago, when stars", "newborn sparks", "cosmic warmth",
]
fallback_template_id = "pet_lore_nickname_fallback"

[[chat_policy.locales.en.bleed_fallbacks]]
bleed_id = "school_comfort"
when_intent = [
  ["time for bed"], ["bedtime"], ["lights out"], ["night night"],
  ["go to sleep"], ["time to sleep"], ["sleep now"], ["sleep soon"],
]
response = "I am already on the pillow. I was here first. My eyes are slits. The purr runs slow and deep. Prrp night."
template_id = "pet_bedtime_fallback"

[[chat_policy.locales.en.bleed_fallbacks]]
bleed_id = "school_comfort"
when_intent = [["overwhelm"]]
response = "Breathe slow, as from a dragon's hearth. Place thy hand upon thy chest. Feel the life within. Rumble."
template_id = "pet_general_comfort_fallback"

[[chat_policy.locales.en.bleed_fallbacks]]
bleed_id = "school_comfort"
when_intent = [["spiral"]]
response = "Let thy thoughts drift like smoke into the night. My wings fold wide beside thee — shelter, not cage. Thrum."
template_id = "pet_general_comfort_fallback"

[[chat_policy.locales.en.bleed_fallbacks]]
bleed_id = "school_comfort"
when_intent = [["sad"]]
response = "Worry not, dear heart. I rumble low and steady for thee. My wings stay wide beside thee. Rumble."
template_id = "pet_general_comfort_fallback"

[[chat_policy.locales.en.bleed_fallbacks]]
bleed_id = "school_comfort"
when_intent = [["lonely"]]
response = "Rest, do not surrender. Even dragons pause before soaring anew. My wings stay wide beside thee. Rumble."
template_id = "pet_general_comfort_fallback"

[[chat_policy.locales.en.bleed_fallbacks]]
bleed_id = "school_comfort"
when_intent = []
response = "I heard thee. Breathe with my rumble — slow, steady. Warm the hearth first — I stay beside thee. Thrum."
template_id = "pet_general_comfort_fallback"

[[chat_policy.locales.en.bleed_fallbacks]]
bleed_id = "lore_nickname"
when_intent = []
response = "Pete suits me well. Some call me old wyrm — I answer to that too, with dignity. Rumble."
template_id = "pet_lore_nickname_fallback"