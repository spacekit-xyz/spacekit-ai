# ============================================================
# Migration notes — what's removed from the sentiment version
# ============================================================
# The following fields exist in the current classifier-shaped
# inference_pets.toml and have NO equivalent in chat mode.
# They are sentiment-classification artifacts and should not
# appear in this file:
#
#   meta_gk_margin                    — sentiment polarity threshold
#   meta_gk_confidence                — sentiment polarity threshold
#   min_meta_confidence_user_anchored — sentiment confidence floor
#   mixed_override_confidence         — sentiment "mixed" class handling
#   default_line_confidence           — sentiment baseline
#   ambiguous_line_confidence         — sentiment ambiguity threshold
#
#   [rules].contrastive_markers       — sentiment surface features
#   [rules].sarcasm_simple            — sarcasm detection
#   [rules].positive_anchor_tokens    — polarity anchors
#   [rules].negative_anchor_tokens    — polarity anchors
#   [rules].bipolar_*_tokens          — polarity classification
#   [rules].pet_companion_surface_tokens — used as classification features
#   [rules].pet_behavior_surface_tokens  — used as classification features
#   [rules].like_perception_verbs     — sentiment verb handling
#   [rules].ambiguous_*_phrases       — sentiment ambiguity dictionaries
#   [rules].evaluative_words          — sentiment vocabulary
#   [rules].disappointment_words      — sentiment polarity
#
# In chat mode, these signals are not relevant because the
# brain isn't classifying input polarity — it's generating
# in-character output. The grounding and the overlay handle
# all routing and disambiguation; the training data handles
# all voice and response shape.

# ============================================================
# Lattice misfire guardrails (character chat — domain inference TOML)
